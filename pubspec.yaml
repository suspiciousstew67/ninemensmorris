name: nine_mens_morris
description: "Nine Men's Morris port with AI (classic & simple) in Flutter."
publish_to: "none"
version: 4.1.1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  shared_preferences: ^2.2.2
  web_socket_channel: ^2.4.0

dev_dependencies:
  flutter_launcher_icons: ^0.13.1
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/tablebase/

flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  image_path_ios: assets/icons/app_icon.png
  macos:
    generate: true
  image_path_macos: assets/icons/app_icon_macos.png
  windows:
    generate: true
  image_path: assets/icons/app_icon_macos.png
